<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650" viewBox="0 0 1600 650">
<title>NMG: framework overview</title>
<desc>Joint witnesses provide feasible requests without action supervision. A policy maps the active goal and current observation to bounded joint updates. Continuous FK feedback and discrete arrival-driven goal advancement close the loop. Full-horizon APG differentiates the rollout objective, and independent task requests evaluate the trained policy.</desc>
